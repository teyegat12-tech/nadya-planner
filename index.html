<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Планер</title>
  <meta name="theme-color" content="#E4E3E9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Планер">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/dark.css">
  <script>
    // тема до отрисовки, чтобы не мигало: light / dark / auto (как на телефоне)
    (function () {
      var t = 'light'; try { t = localStorage.getItem('theme') || 'light'; } catch (e) {}
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#141318' : '#E4E3E9');
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="sheet"></div>
  <div id="logsheet" class="logsheet"></div>
  <div id="toast" class="toast"></div>
  <div id="tip" class="tip"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
